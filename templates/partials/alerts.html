{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
    {% for message in messages %}
    <div class="flex items-center justify-between p-4 mb-3 text-sm rounded-xl shadow-sm {% if message.tags == 'error' %}bg-rose-50 text-rose-800 border border-rose-200{% elif message.tags == 'success' %}bg-emerald-50 text-emerald-800 border border-emerald-200{% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 border border-amber-200{% else %}bg-sky-50 text-sky-800 border border-sky-200{% endif %}" role="alert">
        <div class="flex items-center space-x-3">
            {% if message.tags == 'error' %}
                <i class="fa-solid fa-circle-exclamation text-rose-500 text-lg"></i>
            {% elif message.tags == 'success' %}
                <i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i>
            {% elif message.tags == 'warning' %}
                <i class="fa-solid fa-triangle-exclamation text-amber-500 text-lg"></i>
            {% else %}
                <i class="fa-solid fa-circle-info text-sky-500 text-lg"></i>
            {% endif %}
            <span class="font-medium">{{ message }}</span>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
