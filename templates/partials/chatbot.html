<!-- Floating AI Chatbot Container -->
<div id="aiChatbotWidget" class="fixed bottom-6 right-6 z-50">
    
    <!-- Chat Launcher Bubble -->
    <button id="chatBubble" class="chatbot-bubble w-14 h-14 bg-gradient-to-tr from-teal-600 to-emerald-500 rounded-full flex items-center justify-center text-white text-2xl shadow-2xl focus:outline-none relative group">
        <i class="fa-solid fa-sparkles"></i>
        <span class="absolute -top-1 -right-1 flex h-4 w-4">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-4 w-4 bg-emerald-500 text-[9px] text-white font-bold items-center justify-center">AI</span>
        </span>
    </button>

    <!-- Chat Window Container -->
    <div id="chatWindow" class="hidden chatbot-window absolute bottom-16 right-0 w-[360px] sm:w-[420px] h-[550px] bg-slate-50 rounded-3xl shadow-2xl border border-gray-200/80 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-teal-700 via-teal-600 to-emerald-600 px-5 py-4 text-white flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white">
                    <i class="fa-solid fa-robot text-lg"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm leading-tight">AI Travel Concierge</h3>
                    <div class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
                        <span class="text-[11px] text-teal-100 font-medium">Powered by Gemini AI</span>
                    </div>
                </div>
            </div>
            <button id="chatClose" class="text-white/80 hover:text-white p-1 rounded-lg hover:bg-white/10 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Chat History Scroll Area -->
        <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
            
            <!-- Welcome message -->
            <div class="flex justify-start mb-2">
                <div class="max-w-[88%] rounded-2xl rounded-bl-none px-4 py-3 bg-white border border-gray-100 text-gray-800 shadow-sm leading-relaxed">
                    <p class="font-semibold text-teal-800 mb-1">Namaste & Welcome! ✈️</p>
                    <p>I am your smart AI travel concierge. I can recommend destinations, simulate budgets, verify live weather, and check your active bookings.</p>
                </div>
            </div>

            <!-- Quick Suggestions -->
            <div class="pt-1">
                <p class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-2">Quick Inquiries:</p>
                <div class="flex flex-wrap gap-1.5">
                    <button class="chat-quick-prompt text-xs bg-white hover:bg-teal-50 text-teal-800 border border-teal-200 px-3 py-1.5 rounded-full transition text-left" data-prompt="What is the weather like in Goa?">
                        🌧️ Weather in Goa?
                    </button>
                    <button class="chat-quick-prompt text-xs bg-white hover:bg-teal-50 text-teal-800 border border-teal-200 px-3 py-1.5 rounded-full transition text-left" data-prompt="Suggest places suitable for children">
                        👨‍👩‍👧 Places for kids?
                    </button>
                    <button class="chat-quick-prompt text-xs bg-white hover:bg-teal-50 text-teal-800 border border-teal-200 px-3 py-1.5 rounded-full transition text-left" data-prompt="Show my active booking status">
                        📋 My booking status
                    </button>
                    <button class="chat-quick-prompt text-xs bg-white hover:bg-teal-50 text-teal-800 border border-teal-200 px-3 py-1.5 rounded-full transition text-left" data-prompt="Plan a three-day trip from Hyderabad to Jaipur within ₹15,000">
                        🗺️ 3-day Jaipur plan
                    </button>
                </div>
            </div>

        </div>

        <!-- Input Bar Form -->
        <form id="chatForm" class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2">
            <input type="text" id="chatInput" placeholder="Ask travel question or budget plan..." class="flex-1 bg-gray-100 border border-transparent focus:border-teal-500 focus:bg-white px-4 py-2.5 rounded-full text-sm outline-none transition" autocomplete="off" required>
            <button type="submit" class="w-10 h-10 bg-teal-600 hover:bg-teal-700 text-white rounded-full flex items-center justify-center transition shadow-md shadow-teal-600/30">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </form>

    </div>
</div>
